<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delta Ventures</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="src/assets/logos/dv-green-white-logo.svg"
    />
    <link rel="stylesheet" href="src/assets/styles/output.css" />
  </head>
  <body class="text-white font-secondary bg-green-main">
    <div class="flex flex-col-reverse md:flex-col items-center p-10">
      <!-- VSL Form -->
      <div class="grid grid-cols-1 md:w-5xl gap-5 place-items-center">
        <form
          id="vslForm"
          class="max-w-xl mx-auto bg-green-main p-8 rounded-lg shadow-lg space-y-6"
          action=""
        >
          <h1>¿Estás dispuesto a transformar tu empresa?:</h1>

          <!-- One "tab" for each step in the form: -->

          <div class="block text-sm font-display mb-1">
            <label for="name" class="block text-sm font-display mb-1">
              Name</label
            >
            <input
              class="block w-full rounded-md border-gray-300 shadow-sm focus:ring focus:ring-blue-200 focus:border-blue-500 px-4 py-2"
              placeholder=" First name..."
              oninput="this.className = ''"
            />
          </div>
          <div class="flex flex-row border-2">
            <input
              class="block w-full rounded-md border-black shadow-sm focus:ring focus:ring-blue-200 focus:border-blue-500 px-4 py-2"
              placeholder="E-mail..."
              oninput="this.className = ''"
            />
          </div>
          <div class="flex flex-row border-2">
            <input placeholder="Phone..." oninput="this.className = ''" />
          </div>

          <div class="tab">
            Birthday:
            <p><input placeholder="dd" oninput="this.className = ''" /></p>
            <p><input placeholder="mm" oninput="this.className = ''" /></p>
            <p><input placeholder="yyyy" oninput="this.className = ''" /></p>
          </div>

          <div class="tab">
            Login Info:
            <p>
              <input placeholder="Username..." oninput="this.className = ''" />
            </p>
            <p>
              <input placeholder="Password..." oninput="this.className = ''" />
            </p>
          </div>

          <div style="overflow: auto">
            <div style="float: right">
              <button
                type="button"
                id="prevBtn"
                class="border-2 border-amber-50"
                onclick="nextPrev(-1)"
              >
                Previous
              </button>
              <button type="button" id="nextBtn" onclick="nextPrev(1)">
                Next
              </button>
            </div>
          </div>

          <!-- Circles which indicates the steps of the form: -->
          <div style="text-align: center; margin-top: 40px">
            <span class="step"></span>
            <span class="step"></span>
            <span class="step"></span>
            <span class="step"></span>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
