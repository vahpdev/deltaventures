<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delta Ventures</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="src/assets/logos/dv-green-white-logo.svg"
    />
    <link rel="stylesheet" href="src/assets/styles/output.css" />
  </head>
  <body class="text-white bg-green-main">
    <nav
      id="navbar"
      class="bg-green-main/95 font-primary backdrop-blur-sm fixed top-0 right-0 left-0 transition-transform duration-400 transform-gpu z-50 p-3"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="shrink-0 flex items-center">
            <a href="#inicio" class="flex items-center">
              <img
                src="/src/assets/logos/dv-green-white-logo.svg"
                alt="Delta Ventures logo"
                class="h-10 w-auto mr-3"
              />
            </a>
          </div>

          <div id="desktop-navigation" class="hidden md:block">
            <div class="ml-10 flex items-baseline space-x-8">
              <a
                href="#inicio"
                class="text-white hover:text-lime px-3 py-2 text-xl font-display transition-colors duration-200"
              >
                Inicio
              </a>

              <a
                href="#delta-boost"
                class="text-white hover:text-lime px-3 py-2 text-xl font-display transition-colors duration-200"
              >
                Delta Boost
              </a>
              <a
                href="src/html/conocenos.html"
                class="text-white/80 hover:text-lime block px-3 py-2 text-xl font-display transition-colors duration-200"
              >
                ¿Quienes somos?
              </a>
              <a
                href=""
                class="text-white/80 hover:text-lime block px-3 py-2 text-xl font-display transition-colors duration-200"
              >
                Delta Academy
              </a>
              <a
                href="https://forms.gle/zTG2WKM4ctop22Py9"
                class="bg-lime text-green-main px-6 py-3 rounded-full text-xl font-display hover:bg-lime/90 transition-all duration-200 shadow-sm hover:shadow-md"
              >
                Trabajemos juntos
              </a>
            </div>
          </div>

          <div id="mobile-menu-button" class="md:hidden">
            <button
              id="mobile-menu-button"
              class="inline-flex items-center justify-center p-2 rounded-md text-white/80 hover:text-white hover:bg-light-green focus:outline-none focus:ring-2 focus:ring-inset focus:ring-lime"
            >
              <span class="sr-only">Abrir menú principal</span>
              <svg
                id="menu-icon"
                class="block h-6 w-6"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
              <svg
                id="close-icon"
                class="hidden h-6 w-6"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div id="mobile-menu" class="hidden md:hidden">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
          <a
            href="#inicio"
            class="text-white hover:text-lime block px-3 py-2 text-xl font-display transition-colors duration-200"
          >
            Inicio
          </a>
          <a
            href="#delta-boost"
            class="text-white/80 hover:text-lime block px-3 py-2 text-xl font-display transition-colors duration-200"
          >
            Delta Boost
          </a>
          <a
            href="src/html/conocenos.html"
            class="text-white/80 hover:text-lime block px-3 py-2 text-xl font-display transition-colors duration-200"
          >
            ¿Quienes somos?
          </a>
          <a
            href=""
            class="text-white/80 hover:text-lime block px-3 py-2 text-xl font-display transition-colors duration-200"
          >
            Delta Academy
          </a>

          <div class="px-3 py-4">
            <a
              href="https://forms.gle/zTG2WKM4ctop22Py9"
              class="bg-lime text-green-main px-6 py-3 rounded-full text-xl font-display hover:bg-lime/90 transition-all duration-200 shadow-sm hover:shadow-md inline-block text-center"
            >
              Trabajemos juntos
            </a>
          </div>
        </div>
      </div>
    </nav>

    <script>
      const mobileMenuButton = document.getElementById("mobile-menu-button");
      const mobileMenu = document.getElementById("mobile-menu");
      const menuIcon = document.getElementById("menu-icon");
      const closeIcon = document.getElementById("close-icon");

      mobileMenuButton.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
        menuIcon.classList.toggle("hidden");
        closeIcon.classList.toggle("hidden");
      });
    </script>
  </body>
</html>
